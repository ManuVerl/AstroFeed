[package]
name = "astrofeed"
version = "0.1.0"
edition = "2021"
authors = []
description = "Astronomical & radio-astronomical event tracker"
license = "MIT"
rust-version = "1.75"

[[bin]]
name = "astrofeed"
path = "src/main.rs"

[dependencies]
# UI
eframe = "0.27"
egui = "0.27"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# Orbital mechanics (ISS pass prediction)
sgp4 = "2"

# XML / RSS parsing (ARISS feed)
quick-xml = { version = "0.36", features = ["serialize"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Date & time
chrono = { version = "0.4", features = ["serde"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Cross-platform config/data directories
dirs = "5"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
strip = true
